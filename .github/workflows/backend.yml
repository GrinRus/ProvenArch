name: backend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"

      - name: Run Go tests
        run: go test ./...

      - name: Run coordinator stress check
        run: make test-stress

      - name: Build ACP CLI
        run: go build ./cmd/acp
