version: 1
sweeps:
  - id: baseline
    strategy: sequential
    max_parallel_tasks: 1
    failure_policy: best_effort
    shard_discovery_mode: heuristics
    repo_selection: all

  - id: scale-backend
    strategy: parallel
    max_parallel_tasks: 4
    failure_policy: best_effort
    shard_discovery_mode: semantic
    repo_selection: backend_only

profiles:
  - id: single-path
    source_kind: path
    expected_repo_count: 1
    repos_file: ./repos/curated/single-path.posthog.repos.yaml

  - id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-ftgo-application.repos.yaml

  - id: multi-path
    source_kind: path
    expected_repo_count: 5
    repos_file: ./repos/curated/multi-path.openedx.repos.yaml

  - id: multi-git_url
    source_kind: git_url
    expected_repo_count: 5
    repos_file: ./repos/github/multi-sentry-ecosystem.repos.yaml
