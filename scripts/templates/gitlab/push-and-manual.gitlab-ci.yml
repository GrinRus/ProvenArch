stages:
  - acp

acp-refresh-on-push:
  stage: acp
  image: golang:1.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - go run ./cmd/acp run --workspace "$ACP_WORKSPACE" --pipeline refresh --runtime fake --non-interactive

acp-refresh-manual:
  stage: acp
  image: golang:1.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - go run ./cmd/acp run --workspace "$ACP_WORKSPACE" --pipeline refresh --runtime fake --non-interactive
