name: ui

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Run UI tests
        run: npm run test --prefix ui -- --run

      - name: Build UI
        run: npm run build --prefix ui

      - name: Verify deterministic UI build
        run: make verify-ui-determinism

      - name: Verify embedded UI bundle is fresh
        run: make verify-ui-dist

      - name: Install Playwright Chromium
        run: ./ui/node_modules/.bin/playwright install --with-deps chromium

      - name: Run mock Playwright scenarios
        run: npm run e2e:mock --prefix ui
