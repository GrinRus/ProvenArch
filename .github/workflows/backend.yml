name: backend

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install script test dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Run Go tests
        run: go test ./...

      - name: Run script tests
        run: ./scripts/run-python.sh -m unittest discover -s scripts/tests -p '*_test.py'

      - name: Run coordinator stress check
        run: make test-stress

      - name: Build ACP CLI
        run: go build ./cmd/acp
