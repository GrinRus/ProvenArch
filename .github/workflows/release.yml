name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Verify composite release evidence
        env:
          ACP_RELEASE_MATRIX_IDS: ${{ vars.ACP_RELEASE_MATRIX_IDS }}
          ACP_RELEASE_MATRIX_ID: ${{ vars.ACP_RELEASE_MATRIX_ID }}
          ACP_RELEASE_VERDICT_PATH: ${{ vars.ACP_RELEASE_VERDICT_PATH }}
        run: |
          set -euo pipefail
          waiver_path="reports/release_owner_waiver_${GITHUB_REF_NAME}.json"
          if [ -f "$waiver_path" ]; then
            ./scripts/run-python.sh scripts/verify-release-owner-waiver.py \
              "$waiver_path" --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA"
            exit 0
          fi
          verifier_args=()
          configured_modes=0
          [ -n "${ACP_RELEASE_MATRIX_IDS:-}" ] && configured_modes=$((configured_modes + 1))
          [ -n "${ACP_RELEASE_MATRIX_ID:-}" ] && configured_modes=$((configured_modes + 1))
          [ -n "${ACP_RELEASE_VERDICT_PATH:-}" ] && configured_modes=$((configured_modes + 1))
          if [ "$configured_modes" -ne 1 ]; then
            echo "configure exactly one of ACP_RELEASE_MATRIX_IDS, ACP_RELEASE_MATRIX_ID or ACP_RELEASE_VERDICT_PATH" >&2
            exit 1
          fi
          if [ -n "${ACP_RELEASE_MATRIX_IDS:-}" ]; then
            verifier_args+=(--matrix-ids "$ACP_RELEASE_MATRIX_IDS")
          elif [ -n "${ACP_RELEASE_MATRIX_ID:-}" ]; then
            verifier_args+=(--matrix-id "$ACP_RELEASE_MATRIX_ID")
          elif [ -n "${ACP_RELEASE_VERDICT_PATH:-}" ]; then
            verifier_args+=(--verdict-path "$ACP_RELEASE_VERDICT_PATH")
          fi
          ./scripts/run-python.sh scripts/verify-release-verdict.py "${verifier_args[@]}" \
            --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA"

  release:
    needs: verify-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install script test dependencies
        run: python -m pip install PyYAML==6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            tools/contracts/package-lock.json

      - name: Install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Run contract checks
        run: make contracts

      - name: Run tests
        run: make test

      - name: Run lint
        run: make lint

      - name: Release binaries
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
