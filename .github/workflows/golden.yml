name: golden

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: Run deterministic scenario golden tests
        run: go test ./internal/orchestrator -run 'TestScenarioFixturesDeterministicInitPipeline|TestScenarioFixtureLayoutExists|TestScenarioRunnerFixturesContractAndSemantics|TestScenarioDomainTaskEnvelopesDeterministic|TestDeterministicSnapshotScopeExcludesRunSpecificArtifacts' -count=1
