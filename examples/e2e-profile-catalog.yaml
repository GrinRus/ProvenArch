version: 1

sizing_policy:
  small:
    max_shards: 16
  medium:
    min_shards: 17
    max_shards: 64
  full:
    min_shards: 65

timeout_profiles:
  short-window:
    step_timeout_sec: 3600
    pipeline_timeout_sec: 7200
    ui_init_poll_timeout_sec: 1200
  medium-window:
    step_timeout_sec: 5400
    pipeline_timeout_sec: 14400
    ui_init_poll_timeout_sec: 1500
  extended-window:
    step_timeout_sec: 10800
    pipeline_timeout_sec: 21600
    ui_init_poll_timeout_sec: 1800

repo_sets:
  bank-of-anthos:
    concrete_profile_id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-bank-of-anthos.repos.yaml
    shard_count: 6
    shard_bucket: small
  openedx-ecosystem:
    concrete_profile_id: multi-path
    source_kind: path
    expected_repo_count: 5
    repos_file: ./repos/curated/multi-path.openedx.repos.yaml
    shard_count: 5
    shard_bucket: small
  openstack-ecosystem:
    concrete_profile_id: multi-path
    source_kind: path
    expected_repo_count: 5
    repos_file: ./repos/curated/multi-path.openstack.repos.yaml
    shard_count: 5
    shard_bucket: small
  posthog:
    concrete_profile_id: single-path
    source_kind: path
    expected_repo_count: 1
    repos_file: ./repos/curated/single-path.posthog.repos.yaml
    shard_count: 24
    shard_bucket: medium
  ftgo-application:
    concrete_profile_id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-ftgo-application.repos.yaml
    shard_count: 37
    shard_bucket: medium
  sentry-ecosystem:
    concrete_profile_id: multi-git_url
    source_kind: git_url
    expected_repo_count: 5
    repos_file: ./repos/github/multi-sentry-ecosystem.repos.yaml
    shard_count: 104
    shard_bucket: full
  temporal-platform:
    concrete_profile_id: multi-git_url
    source_kind: git_url
    expected_repo_count: 3
    repos_file: ./repos/github/multi-temporal-platform.repos.yaml
    shard_count: null
    shard_bucket: unmeasured
    diagnostic_only: true
    diagnostic_focus:
      product: Durable workflow orchestration platform
      feature_areas:
        - workflow history and matching services
        - persistence and task queues
        - UI and SDK integration boundaries
  backstage-portal:
    concrete_profile_id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-backstage.repos.yaml
    shard_count: null
    shard_bucket: unmeasured
    diagnostic_only: true
    diagnostic_focus:
      product: Developer portal and plugin platform
      feature_areas:
        - service catalog
        - plugin package boundaries
        - backend/frontend app composition
  airflow-orchestration:
    concrete_profile_id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-airflow.repos.yaml
    shard_count: null
    shard_bucket: unmeasured
    diagnostic_only: true
    diagnostic_focus:
      product: Workflow scheduler and data orchestration platform
      feature_areas:
        - scheduler and executor model
        - DAG/provider/plugin contracts
        - deployment and Helm surfaces
  appwrite-baas:
    concrete_profile_id: single-git_url
    source_kind: git_url
    expected_repo_count: 1
    repos_file: ./repos/github/mono-appwrite.repos.yaml
    shard_count: null
    shard_bucket: unmeasured
    diagnostic_only: true
    diagnostic_focus:
      product: Backend-as-a-service platform
      feature_areas:
        - auth, databases and storage
        - functions and messaging workers
        - realtime/API gateway boundaries
  saleor-commerce:
    concrete_profile_id: multi-git_url
    source_kind: git_url
    expected_repo_count: 3
    repos_file: ./repos/github/multi-saleor-commerce.repos.yaml
    shard_count: null
    shard_bucket: unmeasured
    diagnostic_only: true
    diagnostic_focus:
      product: Headless commerce platform
      feature_areas:
        - checkout and order lifecycle
        - GraphQL API and dashboard boundaries
        - storefront integration

execution_policies:
  regres-default:
    mode: regres
    providers:
      - qwen-code
    sweeps:
      - implicit-baseline
    sweeps_count: 1
    release_mode: false
    notes:
      - Primary debug surface is qwen-only baseline.
      - Additional claude/codex debug stays manual and is not part of profile totals.
  release-default:
    mode: release
    providers:
      - qwen-code
      - claude-code
      - codex-code
    sweeps:
      - baseline
      - parallel-default
    sweeps_count: 2
    release_mode: true
    notes:
      - Release slices keep the existing matrix contract unchanged.
      - Each runnable matrix file must contain exactly one single-* and one multi-* profile.

execution_reporting:
  machine_report:
    - execution_report_<batch-id>.md
    - reports/taskruns/<run_id>-quality.json
  notes:
    - Taskrun quality JSON is runtime telemetry and SWE assessment evidence.
    - Artifact quality warnings do not block matrix or release execution verdicts.
manual_assessments:
  required_for_release: true
  source:
    - reports/swe_ux_assessment_<matrix-id>.md
    - reports/swe_artifact_quality_assessment_<matrix-id>.md
  accepted_decision: accepted

selectors:
  - slug: smoke-tiny
    mode: smoke
    size: tiny
    description: One repo, one run, one provider for fastest live signal.
    release_mode: false
    diagnostic: true
    provider_policy: exactly-one
    default_providers:
      - qwen-code
    default_run_count: 1
    default_run_selection: "1"
    default_frontend_mode: never
    target_repo_sets:
      - bank-of-anthos
    matrix_invocations:
      - matrix_file: ./e2e-matrix.smoke-tiny.bank.yaml
        matrix_id_prefix: smoke-tiny-bank
  - slug: regres-fast
    mode: regres
    size: fast
    description: Existing small qwen-first regression coverage, provider-selectable for diagnostics.
    release_mode: false
    diagnostic: true
    provider_policy: one-or-more
    default_providers:
      - qwen-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
      - openstack-ecosystem
    matrix_invocations:
      - matrix_file: ./e2e-matrix.regres-fast.bank-openedx.yaml
        matrix_id_prefix: regres-fast-bank-openedx
      - matrix_file: ./e2e-matrix.regres-fast.openstack.yaml
        matrix_id_prefix: regres-fast-openstack
  - slug: regres-long
    mode: regres
    size: long
    description: Existing medium regression coverage, provider-selectable for diagnostics.
    release_mode: false
    diagnostic: true
    provider_policy: one-or-more
    default_providers:
      - qwen-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - posthog
      - ftgo-application
    matrix_invocations:
      - matrix_file: ./e2e-matrix.regres-long.yaml
        matrix_id_prefix: regres-long-posthog-ftgo
  - slug: regres-full
    mode: regres
    size: full
    description: Diagnostic baseline sweep over all six canonical repo sets, including Sentry.
    release_mode: false
    diagnostic: true
    provider_policy: one-or-more
    default_providers:
      - qwen-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
      - openstack-ecosystem
      - posthog
      - ftgo-application
      - sentry-ecosystem
    matrix_invocations:
      - matrix_file: ./e2e-matrix.regres-fast.bank-openedx.yaml
        matrix_id_prefix: regres-full-bank-openedx
      - matrix_file: ./e2e-matrix.regres-fast.openstack.yaml
        matrix_id_prefix: regres-full-openstack
      - matrix_file: ./e2e-matrix.regres-long.yaml
        matrix_id_prefix: regres-full-posthog-ftgo
      - matrix_file: ./e2e-matrix.diagnostic.sentry.yaml
        matrix_id_prefix: regres-full-sentry
  - slug: regres-complex
    mode: regres
    size: complex
    description: Diagnostic sweep over more complex product and feature surfaces; rotate targets between runs.
    release_mode: false
    diagnostic: true
    provider_policy: one-or-more
    default_providers:
      - qwen-code
    default_run_count: 1
    default_run_selection: all
    default_frontend_mode: never
    target_repo_sets:
      - temporal-platform
      - backstage-portal
      - airflow-orchestration
      - appwrite-baas
      - saleor-commerce
    feature_rotation_guidance:
      recommended: true
      note: Pick different products and feature areas across diagnostic runs; do not use this selector as a fixed release readiness signal.
    matrix_invocations:
      - matrix_file: ./e2e-matrix.diagnostic.temporal.yaml
        matrix_id_prefix: regres-complex-temporal
      - matrix_file: ./e2e-matrix.diagnostic.backstage.yaml
        matrix_id_prefix: regres-complex-backstage
      - matrix_file: ./e2e-matrix.diagnostic.airflow.yaml
        matrix_id_prefix: regres-complex-airflow
      - matrix_file: ./e2e-matrix.diagnostic.appwrite.yaml
        matrix_id_prefix: regres-complex-appwrite
      - matrix_file: ./e2e-matrix.diagnostic.saleor.yaml
        matrix_id_prefix: regres-complex-saleor
  - slug: release-fast
    mode: release
    size: fast
    description: Canonical release fast selector; command generator only preserves direct harness invocation.
    release_mode: true
    diagnostic: false
    provider_policy: all
    default_providers:
      - qwen-code
      - claude-code
      - codex-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
    matrix_invocations:
      - matrix_file: ./e2e-matrix.release-fast.yaml
        matrix_id_prefix: release-fast
  - slug: release-long
    mode: release
    size: long
    description: Canonical release long selector; command generator only preserves direct harness invocation.
    release_mode: true
    diagnostic: false
    provider_policy: all
    default_providers:
      - qwen-code
      - claude-code
      - codex-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - posthog
      - openstack-ecosystem
    matrix_invocations:
      - matrix_file: ./e2e-matrix.release-long.yaml
        matrix_id_prefix: release-long
  - slug: release-full
    mode: release
    size: full
    description: Canonical release full composite selector; all constituent verdicts must pass.
    release_mode: true
    diagnostic: false
    provider_policy: all
    default_providers:
      - qwen-code
      - claude-code
      - codex-code
    default_run_count: 1
    default_run_selection: all
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
      - posthog
      - openstack-ecosystem
      - ftgo-application
      - sentry-ecosystem
    matrix_invocations:
      - matrix_file: ./e2e-matrix.release-fast.yaml
        matrix_id_prefix: release-full-fast
      - matrix_file: ./e2e-matrix.release-long.yaml
        matrix_id_prefix: release-full-long
      - matrix_file: ./e2e-matrix.release-full.ftgo-sentry.yaml
        matrix_id_prefix: release-full-ftgo-sentry

profiles:
  - slug: regres-fast
    mode: regres
    policy: regres-default
    shard_bucket: small
    timeout_profile: short-window
    expected_backend_runs: 3
    rough_duration_band: short-window
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
      - openstack-ecosystem
    matrix_files:
      - ./e2e-matrix.regres-fast.bank-openedx.yaml
      - ./e2e-matrix.regres-fast.openstack.yaml
  - slug: regres-long
    mode: regres
    policy: regres-default
    shard_bucket: medium
    timeout_profile: medium-window
    expected_backend_runs: 2
    rough_duration_band: medium-window
    target_repo_sets:
      - posthog
      - ftgo-application
    matrix_files:
      - ./e2e-matrix.regres-long.yaml
  - slug: regres-complex
    mode: regres
    policy: regres-default
    shard_bucket: unmeasured
    timeout_profile: extended-window
    expected_backend_runs: 5
    rough_duration_band: extended-window
    diagnostic_only: true
    target_repo_sets:
      - temporal-platform
      - backstage-portal
      - airflow-orchestration
      - appwrite-baas
      - saleor-commerce
    matrix_files:
      - ./e2e-matrix.diagnostic.temporal.yaml
      - ./e2e-matrix.diagnostic.backstage.yaml
      - ./e2e-matrix.diagnostic.airflow.yaml
      - ./e2e-matrix.diagnostic.appwrite.yaml
      - ./e2e-matrix.diagnostic.saleor.yaml
    notes:
      - Diagnostic-only product and feature rotation surface; not a release readiness profile.
      - First trusted-machine runs should record measured shard counts before any promotion into canonical release coverage.
  - slug: release-fast
    mode: release
    policy: release-default
    shard_bucket: small
    timeout_profile: short-window
    expected_backend_runs: 12
    rough_duration_band: short-window
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
    matrix_files:
      - ./e2e-matrix.release-fast.yaml
  - slug: release-long
    mode: release
    policy: release-default
    shard_bucket: medium
    timeout_profile: medium-window
    expected_backend_runs: 12
    rough_duration_band: medium-window
    target_repo_sets:
      - posthog
      - openstack-ecosystem
    matrix_files:
      - ./e2e-matrix.release-long.yaml
    notes:
      - openstack stays the small multi companion because release-mode still requires one multi-* profile per matrix invocation.
  - slug: release-full
    mode: release
    policy: release-default
    shard_bucket: full
    timeout_profile: extended-window
    expected_backend_runs: 36
    rough_duration_band: extended-window
    target_repo_sets:
      - bank-of-anthos
      - openedx-ecosystem
      - posthog
      - openstack-ecosystem
      - ftgo-application
      - sentry-ecosystem
    composite_of_profiles:
      - release-fast
      - release-long
    matrix_files:
      - ./e2e-matrix.release-fast.yaml
      - ./e2e-matrix.release-long.yaml
      - ./e2e-matrix.release-full.ftgo-sentry.yaml
