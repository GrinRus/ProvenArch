version: 1
repos:
  # Exactly one of `path` or `git_url` is expected per repo entry.
  # If `git_url` is used, ACP resolves it through the local `git` context
  # of the current user/runner; ACP does not store separate credentials.
  # The rest of the workspace layout is fixed by MVP convention and is not
  # configured through `workspace.yaml`.
  - name: payments-service
    path: /absolute/path/to/payments-service
    analysis:
      # One shared slash-normalized dialect: * stays in one segment; ** is recursive.
      include: ["src/**", "README.md"]
      exclude: ["src/generated/**"]
  - name: users-service
    git_url: https://gitlab.example.com/platform/users-service.git
    ref: main
docs:
  imports_path: ./docs/imports
runtime:
  profile:
    timeouts:
      # Optional persisted timeout profile (effective precedence: env > workspace > defaults).
      step_timeout_sec: 1800
      heartbeat_sec: 30
      pipeline_timeout_sec: 2400
      pipeline_kill_grace_sec: 30
      api_ready_timeout_sec: 60
      api_init_timeout_sec: 120
      ui_init_poll_timeout_sec: 900
      ui_cancel_poll_timeout_sec: 420
    execution:
      strategy: sequential
      max_parallel_tasks: 1
      failure_policy: best_effort
      shard_discovery:
        mode: heuristics
    permissions:
      # Default keeps provider full-access flags. Use `managed` to disable those
      # flags and let the orchestrator auto-approve only task-envelope operations.
      mode: trusted_full_access
      approval_channel: fail_fast
    steps:
      # Optional step-scoped provider overrides.
      step0_constitution:
        provider: claude-code
      step2_as_is:
        provider: qwen-code
      step3_findings:
        provider: codex-code
      qa:
        provider: codex-code
