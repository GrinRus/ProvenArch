name: golden

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version

      - name: Run deterministic scenario golden tests
        run: go test ./internal/orchestrator -run 'TestScenarioFixturesDeterministicInitPipeline|TestScenarioFixtureLayoutExists|TestScenarioRunnerFixturesContractAndSemantics|TestScenarioDomainTaskEnvelopesDeterministic|TestDeterministicSnapshotScopeExcludesRunSpecificArtifacts' -count=1
