version: 2

project_name: acp

before:
  hooks:
    - ./scripts/run-npm.sh ci --prefix ui
    - ./scripts/run-npm.sh run build --prefix ui
    - rm -rf internal/api/ui_dist/assets internal/api/ui_dist/index.html
    - mkdir -p internal/api/ui_dist/assets
    - cp -R ui/dist/assets/. internal/api/ui_dist/assets/
    - cp ui/dist/index.html internal/api/ui_dist/index.html

builds:
  - id: acp
    main: ./cmd/acp
    binary: acp
    env:
      - CGO_ENABLED=0
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: acp
    ids:
      - acp
    formats:
      - tar.gz
    name_template: "acp_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/INSTALL.md
      - docs/TROUBLESHOOTING.md

checksum:
  name_template: checksums.txt

sboms:
  - id: acp-archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    disable: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore: update generated UI assets$"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: GrinRus
    name: ProvenArch
  draft: false
  prerelease: true
  header: |
    ## Architecture Control Plane MVP beta

    ProvenArch ships as local-first single-binary `acp` archives for macOS/Linux `amd64` and `arm64`.

    Install:
    ```bash
    curl -fsSL https://raw.githubusercontent.com/GrinRus/ProvenArch/main/install.sh | sh
    ```

    Verify downloaded archives with `checksums.txt`. Release artifacts include archive SBOMs and GitHub artifact attestations when the release workflow is used.

    MVP limits: no hosted/SaaS mode, no security/compliance enforcement engine, and live release readiness requires trusted-machine `reports/release_verdict_<matrix-id>.json` evidence.
